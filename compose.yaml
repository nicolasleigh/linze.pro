name: blog

services:
  postgres:
    restart: always
    image: postgres:16.8-alpine3.20
    container_name: blog-postgres
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: nicolas
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - '5432'

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    env_file: './backend/.envrc'
    environment:
      APP_ENV: production
    networks:
      - backend_network
    depends_on:
      - postgres
    ports:
      - '127.0.0.1:8085:8085'

  redis:
    image: redis:6.2-alpine
    restart: always
    container_name: blog-redis
    networks:
      - backend_network
    command: redis-server --save 60 1 --loglevel warning

  frontend:
    restart: always
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: blog-frontend
    environment:
      NODE_ENV: production
      BLOG_API_URL: http://backend:8085/api/v1
      NEXT_PUBLIC_SITE_URL: https://new.linze.pro
    networks:
      - backend_network
    depends_on:
      - backend
    ports:
      - '127.0.0.1:3000:3000'

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['observability']
    container_name: blog-prometheus
    networks:
      - backend_network
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '127.0.0.1:9090:9090'

  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: ['observability']
    container_name: blog-jaeger
    networks:
      - backend_network
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      MEMORY_MAX_TRACES: '2000'
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ['observability']
    container_name: blog-grafana
    networks:
      - backend_network
    depends_on:
      - prometheus
      - jaeger
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

secrets:
  db_password:
    file: db_password.txt

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  backend_network:
    driver: bridge
