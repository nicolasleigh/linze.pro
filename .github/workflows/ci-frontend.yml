name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend-next/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend-next/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test:
    name: Lint, Typecheck & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
