<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ObsAgent CLI architecture</title>
  <desc id="desc">Local-first Obsidian AI workflow with rebuildable indexing, hybrid retrieval, evidence-bounded answering, and human-approved file writes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10151A"/>
      <stop offset="1" stop-color="#1A2228"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2B6B64"/>
      <stop offset="1" stop-color="#1E4B47"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315879"/>
      <stop offset="1" stop-color="#233F5A"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#705B86"/>
      <stop offset="1" stop-color="#4B3D61"/>
    </linearGradient>
    <linearGradient id="write" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9A6940"/>
      <stop offset="1" stop-color="#69462E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" stroke="#8CC7E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" stroke="#F0B77A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .eyebrow { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 3px; fill: #95A7B2; }
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, sans-serif; fill: #F5F7F8; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #AEBBC3; }
      .lane { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: #8EA1AC; }
      .node-title { font: 700 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #F8FAFB; }
      .node-text { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #D2DEE4; }
      .chip { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #D7E7EF; }
      .legend { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #B9C7CE; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="260" fill="#2E5568" opacity="0.14"/>
  <circle cx="180" cy="830" r="300" fill="#6D4C38" opacity="0.12"/>

  <text x="88" y="72" class="eyebrow">OBSAGENT CLI / SYSTEM ARCHITECTURE</text>
  <text x="88" y="126" class="title">A local-first, evidence-bounded AI workflow</text>
  <text x="88" y="164" class="subtitle">The Vault is the source of truth. Retrieval is automatic; file writes require review.</text>

  <text x="88" y="230" class="lane">SOURCE</text>
  <text x="430" y="230" class="lane">PYTHON APPLICATION</text>
  <text x="820" y="230" class="lane">RETRIEVAL + ANSWERING</text>
  <text x="1230" y="230" class="lane">MODEL BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="88" y="266" width="274" height="236" rx="20" fill="url(#source)" stroke="#5DA49A" stroke-opacity="0.7"/>
    <text x="116" y="314" class="node-title">Obsidian Vault</text>
    <text x="116" y="352" class="node-text">Markdown files</text>
    <text x="116" y="380" class="node-text">Front-matter · WikiLinks</text>
    <text x="116" y="408" class="node-text">Headings · tags · callouts</text>
    <rect x="116" y="442" width="144" height="30" rx="15" fill="#183A37"/>
    <text x="133" y="463" class="chip">SOURCE OF TRUTH</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="266" width="300" height="236" rx="20" fill="url(#core)" stroke="#689DC2" stroke-opacity="0.7"/>
    <text x="458" y="314" class="node-title">Parse + Chunk</text>
    <text x="458" y="352" class="node-text">Read-only Markdown parser</text>
    <text x="458" y="380" class="node-text">Context-aware chunking</text>
    <text x="458" y="408" class="node-text">Stable content hashes</text>
    <rect x="458" y="442" width="208" height="30" rx="15" fill="#1D354B"/>
    <text x="475" y="463" class="chip">INCREMENTAL INDEXING</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="266" width="342" height="236" rx="20" fill="url(#core)" stroke="#689DC2" stroke-opacity="0.7"/>
    <text x="848" y="314" class="node-title">SQLite Retrieval Index</text>
    <text x="848" y="352" class="node-text">Metadata + FTS5</text>
    <text x="848" y="380" class="node-text">sqlite-vec embeddings</text>
    <text x="848" y="408" class="node-text">Graph links + RRF fusion</text>
    <rect x="848" y="442" width="178" height="30" rx="15" fill="#1D354B"/>
    <text x="865" y="463" class="chip">HYBRID RETRIEVAL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1230" y="266" width="282" height="236" rx="20" fill="url(#model)" stroke="#A78CC1" stroke-opacity="0.7"/>
    <text x="1258" y="314" class="node-title">Provider Adapters</text>
    <text x="1258" y="352" class="node-text">Ollama · local model</text>
    <text x="1258" y="380" class="node-text">OpenAI · remote model</text>
    <text x="1258" y="408" class="node-text">Consent · budget · retry</text>
    <rect x="1258" y="442" width="168" height="30" rx="15" fill="#3B304B"/>
    <text x="1275" y="463" class="chip">EXPLICIT BOUNDARY</text>
  </g>

  <path d="M362 384H430" stroke="#8CC7E9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M730 384H820" stroke="#8CC7E9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1162 384H1230" stroke="#8CC7E9" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <text x="88" y="584" class="lane">READ / ANSWER PATH</text>
  <text x="88" y="616" class="subtitle">Bounded evidence is loaded from the local index before a model is called.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="654" width="274" height="136" rx="18" fill="#202D36" stroke="#5B7888"/>
    <text x="116" y="700" class="node-title">Context Builder</text>
    <text x="116" y="732" class="node-text">Evidence caps · [S1] citations</text>
    <text x="116" y="758" class="node-text">Abstention when evidence fails</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="654" width="300" height="136" rx="18" fill="#202D36" stroke="#5B7888"/>
    <text x="458" y="700" class="node-title">LangGraph Agent</text>
    <text x="458" y="732" class="node-text">Bounded steps and tool calls</text>
    <text x="458" y="758" class="node-text">Reference-only state + checkpoint</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="654" width="342" height="136" rx="18" fill="url(#write)" stroke="#D39A64"/>
    <text x="848" y="700" class="node-title">Approval-gated Writes</text>
    <text x="848" y="732" class="node-text">Plan → Diff → Human approval</text>
    <text x="848" y="758" class="node-text">OCC · atomic transaction · rollback</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1230" y="654" width="282" height="136" rx="18" fill="url(#source)" stroke="#5DA49A"/>
    <text x="1258" y="700" class="node-title">Updated Vault</text>
    <text x="1258" y="732" class="node-text">Snapshots + recovery journal</text>
    <text x="1258" y="758" class="node-text">Index marked dirty for rebuild</text>
  </g>

  <path d="M1230 548C1030 548 1000 580 730 700" stroke="#8CC7E9" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrowBlue)"/>
  <path d="M730 722H820" stroke="#F0B77A" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <path d="M1162 722H1230" stroke="#F0B77A" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <circle cx="90" cy="852" r="7" fill="#8CC7E9"/>
  <text x="108" y="858" class="legend">Read / retrieval / answer path</text>
  <circle cx="380" cy="852" r="7" fill="#F0B77A"/>
  <text x="398" y="858" class="legend">Write path requiring human approval</text>
  <text x="1230" y="858" class="legend">Local-first · single-user boundary</text>
</svg>
