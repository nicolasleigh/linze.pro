<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Linze.pro bilingual content architecture</title>
  <desc id="desc">Markdown authoring, Go content API, PostgreSQL translations, Next.js rendering and SEO delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7da2ff"/>
    </marker>
    <style>
      .label { fill:#8fa3bf; font:600 18px Inter,Arial,sans-serif; letter-spacing:.08em }
      .title { fill:#edf4ff; font:700 32px Inter,Arial,sans-serif; letter-spacing:-.03em }
      .node-title { fill:#edf4ff; font:700 25px Inter,Arial,sans-serif }
      .node-copy { fill:#a9b9cf; font:500 18px Inter,Arial,sans-serif }
      .small { fill:#8fa3bf; font:500 16px Inter,Arial,sans-serif }
      .box { fill:#15243a; stroke:#415a80; stroke-width:2 }
      .store { fill:#132c36; stroke:#4abf9b; stroke-width:2 }
      .external { fill:#2d2631; stroke:#d8a44d; stroke-width:2 }
      .line { stroke:#7da2ff; stroke-width:3; fill:none; marker-end:url(#arrow) }
      .dashed { stroke:#73839b; stroke-width:2; stroke-dasharray:9 10; fill:none }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <path d="M0 145H1600M0 760H1600" stroke="#21334f" stroke-width="1"/>
  <text x="72" y="76" class="label">LINZE.PRO / CONTENT PLATFORM</text>
  <text x="72" y="120" class="title">One article model. Independent language versions. Server-first delivery.</text>

  <rect x="72" y="260" width="245" height="180" rx="16" class="box"/>
  <text x="105" y="310" class="node-title">Admin workspace</text>
  <text x="105" y="350" class="node-copy">Markdown upload</text>
  <text x="105" y="380" class="node-copy">front-matter + revisions</text>
  <text x="105" y="410" class="small">JWT + RBAC</text>

  <rect x="405" y="235" width="280" height="230" rx="18" class="box"/>
  <text x="445" y="285" class="node-title">Go / chi API</text>
  <text x="445" y="327" class="node-copy">validate · publish</text>
  <text x="445" y="357" class="node-copy">locale fallback</text>
  <text x="445" y="387" class="node-copy">engagement endpoints</text>
  <text x="445" y="427" class="small">REST contract</text>

  <rect x="795" y="190" width="300" height="160" rx="16" class="store"/>
  <text x="835" y="240" class="node-title">PostgreSQL</text>
  <text x="835" y="280" class="node-copy">posts + translations</text>
  <text x="835" y="310" class="node-copy">revisions + reactions</text>

  <rect x="795" y="445" width="300" height="160" rx="16" class="box"/>
  <text x="835" y="495" class="node-title">Next.js App Router</text>
  <text x="835" y="535" class="node-copy">Server Components</text>
  <text x="835" y="565" class="node-copy">Markdown + metadata</text>

  <rect x="1195" y="285" width="330" height="180" rx="16" class="external"/>
  <text x="1235" y="335" class="node-title">Public reader</text>
  <text x="1235" y="375" class="node-copy">SSR / ISR article page</text>
  <text x="1235" y="405" class="node-copy">OG · JSON-LD · RSS</text>
  <text x="1235" y="435" class="small">locale-aware fallback</text>

  <path d="M317 350H405M685 320H795M945 350V445M1095 525H1195M1095 270H1195V285" class="line"/>
  <path d="M1195 470H1095V525" class="dashed"/>
  <text x="330" y="332" class="small">multipart / JSON</text>
  <text x="700" y="302" class="small">persist</text>
  <text x="965" y="410" class="small">read</text>
  <text x="1110" y="505" class="small">render</text>

  <text x="72" y="816" class="label">CONTENT CONTRACT</text>
  <text x="72" y="850" class="small">The requested locale is resolved by the API; Next.js renders the result and keeps engagement client-side.</text>
</svg>
