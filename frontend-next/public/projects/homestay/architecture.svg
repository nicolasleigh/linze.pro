<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Homestay booking transaction architecture</title>
  <desc id="desc">A Go and MySQL booking system with Redis calendar cache, expiry worker and WeChat Pay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7da2ff"/>
    </marker>
    <style>
      .label { fill:#8fa3bf; font:600 18px Inter,Arial,sans-serif; letter-spacing:.08em }
      .title { fill:#edf4ff; font:700 32px Inter,Arial,sans-serif; letter-spacing:-.03em }
      .node-title { fill:#edf4ff; font:700 25px Inter,Arial,sans-serif }
      .node-copy { fill:#a9b9cf; font:500 18px Inter,Arial,sans-serif }
      .small { fill:#8fa3bf; font:500 16px Inter,Arial,sans-serif }
      .box { fill:#15243a; stroke:#415a80; stroke-width:2 }
      .store { fill:#132c36; stroke:#4abf9b; stroke-width:2 }
      .external { fill:#2d2631; stroke:#d8a44d; stroke-width:2 }
      .line { stroke:#7da2ff; stroke-width:3; fill:none; marker-end:url(#arrow) }
      .dashed { stroke:#73839b; stroke-width:2; stroke-dasharray:9 10; fill:none }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <path d="M0 145H1600M0 760H1600" stroke="#21334f" stroke-width="1"/>
  <text x="72" y="76" class="label">HOMESTAY / TRANSACTION PATH</text>
  <text x="72" y="120" class="title">Keep money and inventory authoritative at the database boundary.</text>

  <rect x="72" y="265" width="245" height="170" rx="16" class="box"/>
  <text x="100" y="312" class="node-title">WeChat Mini Program</text>
  <text x="100" y="352" class="node-copy">homestays · calendar</text>
  <text x="100" y="382" class="node-copy">preview · checkout</text>
  <text x="100" y="412" class="small">Bearer JWT + Idempotency-Key</text>

  <rect x="390" y="265" width="190" height="170" rx="16" class="box"/>
  <text x="429" y="312" class="node-title">Nginx</text>
  <text x="429" y="352" class="node-copy">reverse proxy</text>
  <text x="429" y="382" class="node-copy">TLS boundary</text>

  <rect x="655" y="205" width="330" height="290" rx="18" class="box"/>
  <text x="693" y="255" class="node-title">Go / Gin API</text>
  <text x="693" y="297" class="node-copy">Room · Order · Payment services</text>
  <rect x="693" y="330" width="255" height="45" rx="8" fill="#1e3556"/>
  <text x="714" y="359" class="small">server-side pricing</text>
  <rect x="693" y="387" width="255" height="45" rx="8" fill="#1e3556"/>
  <text x="714" y="416" class="small">row-locked inventory</text>
  <text x="693" y="464" class="small">transaction boundary</text>

  <rect x="1090" y="185" width="330" height="175" rx="16" class="store"/>
  <text x="1130" y="235" class="node-title">MySQL</text>
  <text x="1130" y="275" class="node-copy">source of truth</text>
  <text x="1130" y="309" class="small">orders · nightly inventory</text>
  <text x="1130" y="337" class="small">payments · migrations</text>

  <rect x="1090" y="405" width="330" height="145" rx="16" class="store"/>
  <text x="1130" y="455" class="node-title">Redis</text>
  <text x="1130" y="495" class="node-copy">versioned calendar cache</text>
  <text x="1130" y="523" class="small">fail-open on cache errors</text>

  <rect x="655" y="620" width="330" height="100" rx="16" class="box"/>
  <text x="693" y="662" class="node-title">Expiry Worker</text>
  <text x="693" y="696" class="node-copy">scan → release locked stock</text>

  <rect x="1090" y="620" width="330" height="100" rx="16" class="external"/>
  <text x="1130" y="662" class="node-title">WeChat Pay API v3</text>
  <text x="1130" y="696" class="node-copy">prepay · verify · decrypt</text>

  <path d="M317 350H390M580 350H655M985 285H1090M985 420H1090M820 495V620M985 670H1090" class="line"/>
  <path d="M1090 700H985V470" class="dashed"/>
  <text x="325" y="333" class="small">HTTPS</text>
  <text x="590" y="333" class="small">REST</text>
  <text x="1000" y="268" class="small">read / write</text>
  <text x="1000" y="405" class="small">cache read</text>
  <text x="1005" y="650" class="small">notification</text>

  <text x="72" y="816" class="label">DESIGN NOTE</text>
  <text x="72" y="850" class="small">Redis accelerates calendar reads; only MySQL decides price, stock and payment state.</text>
</svg>
